<!DOCTYPE html>
<html>
<head>
    <title>Facebook - EMAN AMIR</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Bar -->
    <div class="topbar">
        <h1>facebook</h1>
        <input type="text" placeholder="Search Facebook">
        <p>EMAN AMIR</p>
    </div>

    <!-- Main Area -->
    <div class="main">

        <!-- Left Side -->
        <div class="left">
            <h3>EMAN AMIR</h3>
            <p>Friends</p>
            <p>Groups</p>
            <p>Memories</p>
            <p>Saved</p>
            <p>Marketplace</p>
        </div>

        <!-- Middle Feed -->
        <div class="feed">

            <!-- Story -->
            <div class="stories">
                <div>+ Create Story</div>
                <div>EMAN</div>
                <div>Ahmed</div>
                <div>Sarah</div>
            </div>

            <!-- Create Post -->
            <div class="box">
                <h3>EMAN AMIR</h3>
                <input type="text" placeholder="What's on your mind?">
                <button>Post</button>
            </div>

            <!-- Post -->
            <div class="box">
                <h3>EMAN AMIR</h3>
                <p>
                    Hello everyone! I am learning HTML and CSS.
                </p>

                <div class="post-picture">
                    EMAN AMIR
                </div>

                <p>👍 Like &nbsp;&nbsp; 💬 Comment &nbsp;&nbsp; Share</p>
            </div>

        </div>

        <!-- Right Side -->
        <div class="right">
            <h3>Contacts</h3>
            <p>🟢 Ahmed</p>
            <p>🟢 Sarah</p>
            <p>🟢 Hamza</p>
            <p>🟢 Ayesha</p>
        </div>

    </div>

</body>
</html>
