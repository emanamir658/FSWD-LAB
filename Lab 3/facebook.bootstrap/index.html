<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facebook - EMAN AMIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Top Bar -->
<nav class="navbar bg-white shadow-sm px-3">
    <div class="container-fluid">
        <a class="navbar-brand facebook-logo fw-bold" href="#">facebook</a>

        <input class="form-control search-box" type="search"
               placeholder="Search Facebook">

        <span class="fw-bold ms-auto">EMAN AMIR</span>
    </div>
</nav>

<!-- Main Layout -->
<div class="container-fluid mt-4">
    <div class="row g-4">

        <!-- Left Sidebar -->
        <aside class="col-lg-3 col-md-3 d-none d-md-block">
            <div class="side-box">
                <h5>EMAN AMIR</h5>
                <p>👥 Friends</p>
                <p>👨‍👩‍👧 Groups</p>
                <p>🕒 Memories</p>
                <p>🔖 Saved</p>
                <p>🛍 Marketplace</p>
            </div>
        </aside>

        <!-- News Feed -->
        <main class="col-12 col-md-6 col-lg-6">

            <!-- Stories -->
            <div class="row g-2 mb-3">
                <div class="col-3">
                    <div class="story">＋<br>Create Story</div>
                </div>
                <div class="col-3">
                    <div class="story">EMAN</div>
                </div>
                <div class="col-3">
                    <div class="story">Ahmed</div>
                </div>
                <div class="col-3">
                    <div class="story">Sarah</div>
                </div>
            </div>

            <!-- Create Post -->
            <div class="post-box mb-3">
                <h5>EMAN AMIR</h5>
                <div class="d-flex gap-2">
                    <input class="form-control rounded-pill"
                           type="text" placeholder="What's on your mind?">
                    <button class="btn btn-primary">Post</button>
                </div>
            </div>

            <!-- Post -->
            <div class="post-box">
                <h5>EMAN AMIR</h5>
                <p>Hello everyone! I am learning HTML and CSS.</p>

                <div class="post-picture">EMAN AMIR</div>

                <div class="d-flex justify-content-around mt-3 text-secondary">
                    <span>👍 Like</span>
                    <span>💬 Comment</span>
                    <span>↗ Share</span>
                </div>
            </div>

        </main>

        <!-- Right Sidebar -->
        <aside class="col-lg-3 col-md-3 d-none d-md-block">
            <div class="side-box">
                <h5>Contacts</h5>
                <p>🟢 Ahmed</p>
                <p>🟢 Sarah</p>
                <p>🟢 Hamza</p>
                <p>🟢 Ayesha</p>
            </div>
        </aside>

    </div>
</div>

</body>
</html>
